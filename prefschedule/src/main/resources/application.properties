spring.application.name=refSchedule
spring.datasource.url=jdbc:postgresql://localhost:5432/prefschedule
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.cache.type=simple
# Permite Flyway s? ?tearg? datele (disabled by default în prod pentru siguran??)
spring.flyway.clean-disabled=false

# Instruie?te Flyway s? ?tearg? schema complet înainte de a rula migr?rile
# (Ideal pentru mediul de dezvoltare/benchmark, DEZASTRUOS pentru produc?ie)
spring.flyway.baseline-on-migrate=true
# Adauga la final
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=pref-schedule-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Configurare Resilience4j
resilience4j.circuitbreaker.instances.stableMatchService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.stableMatchService.waitDurationInOpenState=5000ms
resilience4j.circuitbreaker.instances.stableMatchService.slidingWindowSize=10

resilience4j.retry.instances.stableMatchService.maxAttempts=3
resilience4j.retry.instances.stableMatchService.waitDuration=1000ms

resilience4j.timelimiter.instances.stableMatchService.timeoutDuration=2s
# MongoDB Config
spring.data.mongodb.uri=mongodb://localhost:27017/pref_read_db
